name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check service and feedback boundaries
        run: |
          node scripts/check-component-transport.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-feedback-contract.mjs
      - name: Build real application
        run: npm run build -- --outDir .ci-build/real
        env:
          VITE_FRONTEND_DATA_MODE: real
      - name: Build isolated mock application
        run: npm run build -- --outDir .ci-build/mock
        env:
          VITE_FRONTEND_DATA_MODE: mock

  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install existing image-processing runtime
        run: |
          python -m pip install numpy==1.25.1 opencv-python==4.8.0.76
          "GVPAK_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: cargo build --locked --release --manifest-path backend/Cargo.toml
